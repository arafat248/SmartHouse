        paid_by_detail:
          allOf:
          - $ref: '#/components/schemas/HouseholdMember'
          readOnly: true
        expense_date:
          type: string
          format: date
        description:
          type: string
        receipt:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - category_detail
      - created_at
      - expense_date
      - household
      - id
      - paid_by
      - paid_by_detail
      - title
      - updated_at
