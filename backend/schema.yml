  /api/v1/deposits/:
    get:
      operationId: api_v1_deposits_list
      parameters:
      - in: query
        name: deposit_date
        schema:
          type: string
          format: date
      - in: query
        name: deposit_date__gte
        schema:
          type: string
          format: date
      - in: query
        name: deposit_date__lte
        schema:
          type: string
          format: date
      - in: query
        name: member
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: payment_method
        schema:
          type: string
          enum:
          - BANK_TRANSFER
          - CARD
          - CASH
          - OTHER
          - PAYPAL
          - VENMO
        description: |-
          * `CASH` - Cash
          * `BANK_TRANSFER` - Bank Transfer
          * `CARD` - Card
          * `VENMO` - Venmo
          * `PAYPAL` - PayPal
          * `OTHER` - Other
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDepositList'
          description: ''
    post:
      operationId: api_v1_deposits_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DepositRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DepositRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deposit'
          description: ''
  /api/v1/deposits/{id}/:
    get:
      operationId: api_v1_deposits_retrieve
      parameters:
      - in: path
