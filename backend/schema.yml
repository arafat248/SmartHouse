components:
  schemas:
    ActionEnum:
      enum:
      - LOGIN
      - LOGOUT
      - CREATE_EXPENSE
      - UPDATE_EXPENSE
      - DELETE_EXPENSE
      - CREATE_MEAL
      - UPDATE_MEAL
      - DELETE_MEAL
      - ADD_DEPOSIT
      - UPDATE_DEPOSIT
      - DELETE_DEPOSIT
      - INVITE_MEMBER
      - REMOVE_MEMBER
      - CREATE_SETTLEMENT
      - FINALIZE_SETTLEMENT
      type: string
      description: |-
        * `LOGIN` - Login
        * `LOGOUT` - Logout
        * `CREATE_EXPENSE` - Create Expense
        * `UPDATE_EXPENSE` - Update Expense
        * `DELETE_EXPENSE` - Delete Expense
        * `CREATE_MEAL` - Create Meal
        * `UPDATE_MEAL` - Update Meal
        * `DELETE_MEAL` - Delete Meal
        * `ADD_DEPOSIT` - Add Deposit
        * `UPDATE_DEPOSIT` - Update Deposit
        * `DELETE_DEPOSIT` - Delete Deposit
        * `INVITE_MEMBER` - Invite Member
        * `REMOVE_MEMBER` - Remove Member
        * `CREATE_SETTLEMENT` - Create Settlement
        * `FINALIZE_SETTLEMENT` - Finalize Settlement
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          nullable: true
        user_email:
          type: string
          format: email
          readOnly: true
        household:
          type: integer
          readOnly: true
          nullable: true
        household_name:
          type: string
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        entity:
          type: string
          readOnly: true
          nullable: true
        entity_id:
          type: integer
          readOnly: true
          nullable: true
        description:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - created_at
      - description
      - entity
      - entity_id
      - household
      - household_name
      - id
      - ip_address
      - user
      - user_email
    ChangePassword:
      type: object
      properties:
        old_password:
          type: string
        new_password:
          type: string
      required:
      - new_password
      - old_password
    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 1
      required:
      - new_password
      - old_password
    DailyReportResponse:
      type: object
      properties:
        results:
          type: array
          items: {}
      required:
      - results
    DashboardResponse:
      type: object
      properties:
        metrics:
          type: object
          additionalProperties: {}
        recent_activity:
          type: object
          additionalProperties: {}
        charts:
          type: object
          additionalProperties: {}
      required:
      - charts
      - metrics
      - recent_activity
    Deposit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        household:
          type: integer
        member:
          type: integer
        member_detail:
          allOf:
          - $ref: '#/components/schemas/HouseholdMember'
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        deposit_date:
          type: string
          format: date
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        reference:
          type: string
          maxLength: 255
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - deposit_date
      - household
      - id
      - member
      - member_detail
      - updated_at
    DepositRequest:
      type: object
      properties:
        household:
          type: integer
        member:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        deposit_date:
          type: string
          format: date
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        reference:
          type: string
          maxLength: 255
        notes:
          type: string
      required:
      - amount
      - deposit_date
      - household
      - member
    Expense:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        household:
          type: integer
        title:
          type: string
          maxLength: 255
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        category:
          type: integer
          nullable: true
        category_detail:
          allOf:
          - $ref: '#/components/schemas/ExpenseCategory'
